# Copy to .github/workflows/pr-review.yml and replace <SHA> with the commit of the tag.
# A commit, not a tag, because this action receives the key.
name: AI PR review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Dependabot gets no secrets, and its every PR would go red for a missing key.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: ysilvestrov/detent@<SHA> # v0.5.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # Or one of these, with the models set in `prReview` of detent.json:
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
